<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ThUnselect settings</title>
  <link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="options.css">
  <script src="options.js" defer></script>
</head>
<body>
  <main>
    <h1><img src="../icons/icon.svg" width="40" height="40" alt=""> ThUnselect</h1>
    <label>
      <input id="enabled" type="checkbox" disabled aria-describedby="explanation">
      Do not select next message after removal/archiving
    </label>
    <p id="explanation">
      Leave the message list with no selection after deleting, archiving, or
      moving selected messages. The message preview is cleared.
    </p>
    <p>Applies immediately to all Mail tabs. Uncheck to restore Thunderbird’s normal behavior.</p>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
